name: European quadruped fauna tests

on:
  pull_request:
    paths:
      - 'src/**'
      - 'tools/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/fauna-quadrupeds.yml'
  workflow_dispatch:

jobs:
  species:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Verify species build, animation actions and bake
        run: npm test -- squirrel beaver badger bison --quality low
      - name: Verify species morphs and bone matrices
        run: node tools/test-fauna-quadrupeds.mjs
